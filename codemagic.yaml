workflows:
  sample-workflow:
    name: iOS Device Build (IPA)
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: agriconnect_v0

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build iOS Project
        script: |
          # Bypasses Apple Developer Team requirement by compiling for simulator
          flutter build ios --simulator --no-codesign

      - name: Create Manual IPA
        script: |
          # Packages the simulator files into the IPA format Sideloadly needs
          cd build/ios/iphonesimulator
          mkdir Payload
          cp -r Runner.app Payload
          zip -vr Runner.ipa Payload

    artifacts:
      # The final output file you will download
      - build/ios/iphonesimulator/Runner.ipa

    publishing:
      email:
        recipients:
          - cyusaimpanochrispin@gmail.com
          - hassanousman1010@gmail.com
